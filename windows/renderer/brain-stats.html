<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Brain Stats — population activity</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%;
               background: #0c0f15; color: #d8d8d8;
               font: 12px "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #header { padding: 8px 10px 6px; background: #14181f;
            border-bottom: 1px solid #1f2530; flex: 0 0 auto; }
  #header .title { color: #fff; font-weight: 600; }
  #header .meta  { color: #8a96a8; font-size: 10px; margin-top: 2px; }
  #bars { flex: 1 1 auto; overflow-y: auto; padding: 6px 10px; }
  /* Column header drawn once at the top of the chart — not per row. */
  .col-header {
    display: grid;
    grid-template-columns: 70px 1fr 1fr 60px;
    grid-column-gap: 8px;
    padding: 4px 0 6px;
    border-bottom: 1px solid #1f2530;
    margin-bottom: 6px;
    color: #8a96a8;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .col-header .label { text-align: left; }
  .col-header .col   { text-align: left; }
  .col-header .num   { text-align: right; }
  /* Each row: behaviour name | lifetime share bar | recent share bar | count */
  .row { display: grid;
         grid-template-columns: 70px 1fr 1fr 60px;
         grid-column-gap: 8px;
         align-items: center;
         margin-bottom: 5px;
         font: 11px Consolas, monospace; }
  .row .name { color: #fff; font-weight: 600; }
  .row .name .sub { color: #6da8d6; font-size: 9px; font-weight: 400; display: block; }
  .row .track { position: relative; height: 12px;
                background: #0c0f15; border-radius: 2px;
                overflow: hidden; }
  .row .fill { position: absolute; top: 0; bottom: 0; left: 0; }
  .row .fill.lifetime { background: #4a90e2; }
  .row .fill.recent   { background: #1f4d80; }
  .row .num { color: #b8d0ff; text-align: right; font-size: 11px; }
  .row.disabled { opacity: 0.4; }
  #status { padding: 4px 10px; color: #8a96a8; font-size: 10px;
            background: #14181f; border-top: 1px solid #1f2530;
            flex: 0 0 auto; }
</style>
</head>
<body>
<div id="header">
  <div class="title">Brain Stats</div>
  <div class="meta" id="meta">loading…</div>
</div>
<div id="bars"></div>
<div id="status">waiting for first state event…</div>
<script type="module" src="./brain-stats.js"></script>
</body>
</html>
