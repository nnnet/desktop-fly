<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Fly Brain — FlyWire v783</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #080a10;
               font: 11px "Segoe UI", system-ui, sans-serif; }
  /* The 3D point cloud is rendered into a <canvas> that brain.js
     creates and appends to the body (it sizes the canvas to the
     window and lets CSS set the block-display). The brain window
     is 340x300 (see main.js); the state-line floats over the
     top 18 px. There is no other content in the body, so the
     canvas is laid out at (0, 0) of the window. */
  canvas { display: block; }
  #label {
    position: fixed; left: 50%; top: 0; width: 340px;
    padding: 4px 8px; border-radius: 0 0 6px 6px;
    background: rgba(0, 0, 0, 0.55); color: #f2f2f2; font-weight: 500;
    white-space: nowrap; pointer-events: none; opacity: 0;
    transition: opacity 0.15s; transform: translateX(-50%);
  }
  #label.on { opacity: 1; }
  /* Brain state line: a single row at the top of the window
     showing the current behavioural state and the nine population
     rates. Spec: brain-state-readout. The bar charts live in the
     trainer window's Memory tab. */
  #state-line {
    position: fixed; left: 0; right: 0; top: 0; height: 18px;
    display: flex; align-items: center; gap: 8px; padding: 0 8px;
    background: rgba(0, 0, 0, 0.65); color: #d8d8d8;
    font: 11px "Consolas", monospace; white-space: nowrap;
    border-bottom: 1px solid #1f2530; z-index: 10;
    overflow: hidden;
  }
  #state-line .tag { font-weight: 700; color: #ffd23f;
                     flex: 0 0 50px; }
  #state-line .rates { color: #8a96a8; font-size: 10px;
                       white-space: nowrap; overflow: hidden;
                       text-overflow: ellipsis; flex: 1 1 auto; }
  /* Per-influence proximity + escape teaching signal. Same line,
     right-aligned, coloured so it doesn't compete with the rates
     block. Hidden when no influence is currently active so the
     rates block can take the full row. */
  #state-line .prox { color: #ff8080; font-size: 10px;
                      white-space: nowrap; overflow: hidden;
                      text-overflow: ellipsis; flex: 0 0 auto;
                      margin-left: 8px; }
  #state-line .prox .esc { color: #c8a0ff; }
  #state-line .prox .none { display: none; }
                     flex: 0 0 50px; }
  #state-line .rates { color: #8a96a8; font-size: 10px;
                       white-space: nowrap; overflow: hidden;
                       text-overflow: ellipsis; flex: 1 1 auto; }

</style>
</head>
<body>
<div id="state-line"><span class="tag">—</span><span class="rates"></span><span class="prox"></span></div>
<div id="memory-panel"></div>
<div id="label"></div>
<script type="module" src="./brain.js"></script>
</body>
</html>
