<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Fly Brain — FlyWire v783</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #080a10;
               font: 11px "Segoe UI", system-ui, sans-serif; }
  /* The 3D point cloud is rendered into a fixed-size <canvas> in
     the upper part of the window. The brain window is 340x540
     (see main.js); the canvas is 300x300 (the brain is
     unchanged from the original 340x300 design), and the lower
     240 px holds the state line + memory panel. */
  canvas { display: block; width: 340px; height: 300px; }
  #label {
    position: fixed; left: 50%; top: 0; width: 340px;
    padding: 4px 8px; border-radius: 0 0 6px 6px;
    background: rgba(0, 0, 0, 0.55); color: #f2f2f2; font-weight: 500;
    white-space: nowrap; pointer-events: none; opacity: 0;
    transition: opacity 0.15s; transform: translateX(-50%);
  }
  #label.on { opacity: 1; }
  /* Brain state line: a single row immediately under the 3D
     canvas. Shows the current behavioural state and the nine
     population rates. Spec: brain-state-readout. */
  #state-line {
    position: fixed; left: 0; right: 0; top: 300px; height: 22px;
    display: flex; align-items: center; gap: 6px; padding: 0 8px;
    background: rgba(0, 0, 0, 0.65); color: #d8d8d8;
    font: 10px "Consolas", monospace; white-space: nowrap;
    border-bottom: 1px solid #1f2530; z-index: 10;
    overflow: hidden;
  }
  #state-line .tag { font-weight: 700; color: #ffd23f;
                     flex: 0 0 38px; }
  #state-line .rates { color: #8a96a8; font-size: 9px;
                       white-space: nowrap; overflow: hidden;
                       text-overflow: ellipsis; flex: 1 1 auto; }
  /* Memory mini-panel: top-10 Hebbian weight bars under the state
     line. Each bar shows the population pair (pre -> post) on
     the left, the magnitude as a coloured bar (green for LTP /
     weight grew, red for LTD / weight shrank), and the signed
     dW value (4 decimal places) on the right. Sorted by |dW|
     descending. Spec: brain-trainer-memory-view (we render
     10 here to keep the brain window compact). */
  #memory-panel {
    position: fixed; left: 0; right: 0; top: 324px; bottom: 0;
    overflow-y: auto; padding: 6px 8px 6px 8px;
    background: rgba(0, 0, 0, 0.45); color: #d8d8d8;
    font: 10px "Consolas", monospace;
    z-index: 9; display: none;
  }
  #memory-panel.on { display: block; }
  #memory-panel .placeholder { color: #8a96a8; font-style: italic;
                              padding: 6px 0; }
  #memory-panel .header { color: #5a6478; font-size: 9px;
                          text-transform: uppercase; letter-spacing: 0.04em;
                          margin-bottom: 4px; }
  #memory-panel .bar { display: grid;
                       grid-template-columns: 105px 1fr 60px;
                       align-items: center; gap: 6px; margin-bottom: 2px; }
  #memory-panel .bar .label { color: #d8d8d8; font-size: 10px;
                              white-space: nowrap; overflow: hidden;
                              text-overflow: ellipsis; }
  #memory-panel .bar .track { background: #0c0f15; border-radius: 2px;
                              height: 10px; position: relative; overflow: hidden; }
  #memory-panel .bar .fill { position: absolute; top: 0; bottom: 0; }
  #memory-panel .bar .fill.ltp { background: #4caf50; }
  #memory-panel .bar .fill.ltd { background: #ef5350; }
  #memory-panel .bar .dW { text-align: right; color: #b8d0ff;
                           font-size: 10px; }
</style>
</head>
<body>
<canvas id="brain-canvas"></canvas>
<div id="state-line"><span class="tag">—</span><span class="rates"></span></div>
<div id="memory-panel"></div>
<div id="label"></div>
<script type="module" src="./brain.js"></script>
</body>
</html>
